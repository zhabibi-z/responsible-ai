name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install package with analysis + dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[analysis,dev]"
      - name: Run smoke tests
        run: pytest -q
